trainer:
  max_epochs: 40
  accelerator: gpu
  precision: bf16-mixed
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: lightning_logs
      name: cdm/hole
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: epoch={epoch}-val_loss_epoch={val/loss_epoch:.3f}
        monitor: val/loss_epoch
        save_last: true
        auto_insert_metric_name: false
        save_on_exception: true
model:
  class_path: vit.models.cdm.synth.HoleModel
  init_args:
    dinov3_vitl16_checkpoint_path: ${oc.env:HOME}/src/models/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
    log_n_images: 4
data:
  class_path: vit.models.cdm.synth.ByteCameraDepthDataModule
  init_args:
    data_dir: ${oc.env:HOME}/src/datasets/ByteCameraDepth/recorded_data/
    depth: false
    hole_mask: true
    batch_size: 24
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1e-3
