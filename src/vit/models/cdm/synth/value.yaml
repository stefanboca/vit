trainer:
  max_epochs: 20
  accelerator: gpu
  precision: bf16-mixed
  log_every_n_steps: 25
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: lightning_logs
      name: cdm/value
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: epoch={epoch}-val_abs_rel={val/affine_abs_rel_epoch:.4f}
        monitor: val/affine_abs_rel_epoch
        mode: min
        save_last: false
        auto_insert_metric_name: false
        save_on_exception: false
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: last
        save_top_k: 1
        save_last: false
        every_n_epochs: 1
        save_on_train_epoch_end: true
        enable_version_counter: false
        save_on_exception: true
model:
  class_path: vit.models.cdm.synth.ValueModel
  init_args:
    log_n_images: 4
    val_log_indices: [100, 911, 1550, 2145]
data:
  class_path: vit.models.cdm.synth.ByteCameraDepthDataModule
  init_args:
    data_dir: ${oc.env:HOME}/src/datasets/ByteCameraDepth/recorded_data/
    depth: true
    holes: true
    size: [308, 504]
    batch_size: 20
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1e-5
