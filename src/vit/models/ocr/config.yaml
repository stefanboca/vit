trainer:
  max_epochs: 20
  accelerator: gpu
  precision: bf16-mixed
  # limit_train_batches: 0.01
  # limit_val_batches: 0.01
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: lightning_logs
      name: ocr
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: epoch={epoch}-val_loss={val/loss:.4f}
        monitor: val/loss
        mode: min
        save_last: false
        auto_insert_metric_name: false
        save_on_exception: false
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: last
        save_top_k: 1
        save_last: false
        every_n_epochs: 1
        save_on_train_epoch_end: true
        enable_version_counter: false
        save_on_exception: true
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
model:
  class_path: vit.models.ocr.OcrVit
  init_args:
    # the longest sequence in the dataset is 27 tokens
    max_generation_length: 32
    learning_rate: 1e-4
    warmup_steps: 1000
    # About 20 epochs at 256 examples per batch; same-size bucketing adds tails.
    # Hold at min_learning_rate after this many total optimizer steps.
    total_steps: 800000
    min_learning_rate: 5e-6
    cached_features: ${data.init_args.load_features}
data:
  class_path: vit.models.ocr.SynthTigerDataModule
  init_args:
    data_dir: ${oc.env:HOME}/src/datasets/synthetic-ocr-1
    features_dir: ${oc.env:HOME}/src/datasets/synthetic-ocr-1-features/vit_small_plus_patch16_dinov3
    batch_size: 128
    load_features: true
