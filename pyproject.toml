[project]
name = "vit"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "stefan", email = "stefan.r.boca@gmail.com" }]
dependencies = [
  "depth-anything-3",
  "dinov2",
  "dinov3",
  "pillow>=12.3.0",
  "torch>=2.13.0",
  "torchvision>=0.28.0",
]

[dependency-groups]
dev = [
  "icecream>=2.2.0",
  "ipykernel>=7.3.0",
  "ipython>=9.16.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = [
  # for dinov2
  "torch>=2.13.0",
  "torchvision>=0.28.0",
  "xformers>=0.0.35"
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
depth-anything-3 = { git = "https://github.com/ByteDance-Seed/Depth-Anything-3.git", rev = "3d835ec1a5802d64a8b8b15f817a1ab54809bfe4" }
dinov2 = { git = "https://github.com/facebookresearch/dinov2.git", rev = "7764ea0f912e53c92e82eb78a2a1631e92725fc8" }
dinov3 = { git = "https://github.com/facebookresearch/dinov3.git", rev = "6876159a11b4df116f30f667f8c9888617df0751" }
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
xformers = [{ index = "pytorch-cu130" }]
