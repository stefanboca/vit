[project]
name = "vit"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "stefan", email = "stefan.r.boca@gmail.com" }]
dependencies = [
  # Needed by Depth Anything 3, but only pulled in through optional exporters.
  "addict>=2.4.0",
  "depth-anything-3",
  "lightning[pytorch-extra]>=2.6.5",
  "matplotlib>=3.11.1",
  "ml-dtypes>=0.5.0",
  "pillow>=12.3.0",
  "rerun-sdk[catalog,dataloader,notebook]>=0.38.1",
  "segmentation-models-pytorch>=0.5.0",
  "timm>=1.0.28",
  "tokenizers>=0.23.2",
  "torch>=2.13.0",
  "torchdata>=0.11.0",
  "torchmetrics>=1.9.0",
  "torchvision>=0.28.0",
]

[project.optional-dependencies]
onnx = [
  "onnx>=1.19.0",
  "onnxscript>=0.5.0",
  "onnxruntime-gpu>=1.29.0",
]

[dependency-groups]
dev = [
  "icecream>=2.2.0",
  "ipykernel>=7.3.0",
  "ipython>=9.16.1",
  "tensorboard>=2.21.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = [
  "numpy>=2",
  # Depth Anything 3's optional exporters do not support Python 3.14.
  "open3d ; python_version < '3.14'",
  "pycolmap ; python_version < '3.14'",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
depth-anything-3 = { git = "https://github.com/ByteDance-Seed/Depth-Anything-3.git", rev = "3d835ec1a5802d64a8b8b15f817a1ab54809bfe4" }
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]
